name: Build FitGhar Test APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          rm -rf android-project
          mkdir android-project
          unzip -q FitGhar_Android_Test_Project_Phone_Build.zip -d android-project
          test -f android-project/settings.gradle.kts
          test -f android-project/app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-disabled: 'true'

      - name: Build debug APK
        working-directory: android-project
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: FitGhar-Test-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
